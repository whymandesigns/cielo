<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a2a3a" />
    <title>Cielo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600&family=Spline+Sans+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-sky="sunny" data-phase="day" data-hour="h23" data-sky-bar="off">
    <div class="atmosphere" aria-hidden="true">
      <div class="mesh"></div>
      <div class="sun"></div>
      <div class="moon"></div>
      <div class="horizon"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
      <canvas class="rain" aria-hidden="true"></canvas>
      <div class="stars"></div>
      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <main class="stage">
      <div class="lens">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="47.4" />
          <circle class="ring-progress" cx="50" cy="50" r="47.4" />
        </svg>

        <div class="face t-stagger">
          <p class="place t-stagger-line t-stagger-line--1">
            <span class="t-text-swap" data-place>Finding the sky…</span>
          </p>

          <time class="clock" datetime="">
            <span class="hours t-digit-group" data-hours></span>
            <span class="colon" aria-hidden="true">:</span>
            <span class="minutes t-digit-group" data-minutes></span>
            <span class="aux">
              <span class="seconds" data-seconds></span>
              <span class="period" data-period hidden></span>
            </span>
          </time>

          <p class="meta t-stagger-line t-stagger-line--2">
            <span class="t-text-swap" data-sky-label>Listening</span>
            <span class="dot" aria-hidden="true">·</span>
            <span data-temp></span>
            <span class="dot" aria-hidden="true">·</span>
            <span data-date></span>
          </p>
        </div>
      </div>
    </main>

    <div class="dock">
      <button
        type="button"
        class="dock-btn settings-toggle"
        aria-haspopup="dialog"
        aria-controls="settings"
        aria-expanded="false"
        title="Settings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            d="M4 8h16M4 16h16M8 5v6M16 13v6"
          />
        </svg>
        <span class="sr-only">Settings</span>
      </button>

      <button
        type="button"
        class="dock-btn mood-toggle"
        data-mood-toggle
        aria-pressed="false"
        title="Play soundscape"
      >
        <span class="t-icon-swap" data-state="a">
          <svg class="t-icon" data-icon="a" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.8 9.2h2.4L11 6.2v11.6L7.2 14.8H4.8A1.2 1.2 0 0 1 3.6 13.6v-2.4A1.2 1.2 0 0 1 4.8 10z"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              d="m15.2 9.4 5.2 5.2M20.4 9.4l-5.2 5.2"
            />
          </svg>
          <svg class="t-icon" data-icon="b" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.8 9.2h2.4L11 6.2v11.6L7.2 14.8H4.8A1.2 1.2 0 0 1 3.6 13.6v-2.4A1.2 1.2 0 0 1 4.8 10z"
            />
            <path
              class="mood-wave"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              d="M14.6 9.1c1.1 1.1 1.1 4.7 0 5.8"
            />
            <path
              class="mood-wave mood-wave--far"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              d="M17.4 7c2.2 2.1 2.2 7.9 0 10"
            />
          </svg>
        </span>
        <span class="sr-only">Play soundscape</span>
      </button>

      <nav class="preview sky-picks" aria-label="Sky faces" hidden>
        <button type="button" data-preview="live" class="is-active">Live</button>
        <button type="button" data-preview="sunrise">Dawn</button>
        <button type="button" data-preview="sunset">Dusk</button>
        <button type="button" data-preview="sunny">Clear</button>
        <button type="button" data-preview="cloudy">Cloud</button>
        <button type="button" data-preview="rainy">Rain</button>
        <span class="sky-split" aria-hidden="true"></span>
        <button type="button" data-night>Night</button>
      </nav>
    </div>

    <div class="settings-scrim" data-settings-dismiss hidden></div>
    <div
      class="settings t-modal"
      id="settings"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      hidden
    >
      <div class="settings-card">
        <header class="settings-head">
          <h2 id="settings-title">Settings</h2>
          <button type="button" class="settings-close" data-settings-close aria-label="Close settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.58 7.1 5.7a1 1 0 0 0-1.4 1.42L10.58 12 5.7 16.9a1 1 0 1 0 1.42 1.4L12 13.42l4.9 4.88a1 1 0 0 0 1.4-1.42L13.42 12l4.88-4.9a1 1 0 0 0 0-1.4Z"
              />
            </svg>
          </button>
        </header>

        <section class="settings-block">
          <h3>Time format</h3>
          <div class="t-tabs" data-tabs="hour" role="tablist" aria-label="Time format">
            <span class="t-tabs-pill" aria-hidden="true"></span>
            <button type="button" class="t-tab" role="tab" data-hour="h23" aria-selected="true">24-hour</button>
            <button type="button" class="t-tab" role="tab" data-hour="h12" aria-selected="false">12-hour</button>
          </div>
        </section>

        <section class="settings-block">
          <h3>Temperature</h3>
          <div class="t-tabs" data-tabs="temp" role="tablist" aria-label="Temperature">
            <span class="t-tabs-pill" aria-hidden="true"></span>
            <button type="button" class="t-tab" role="tab" data-temp-unit="c" aria-selected="true">Celsius</button>
            <button type="button" class="t-tab" role="tab" data-temp-unit="f" aria-selected="false">Fahrenheit</button>
          </div>
        </section>

        <section class="settings-block">
          <div class="settings-switch-row">
            <div>
              <h3>Preview mode</h3>
              <p class="settings-hint">Simulate weather conditions.</p>
            </div>
            <label class="sky-switch">
              <input type="checkbox" data-preview-mode />
              <span class="sky-switch-knob" aria-hidden="true"></span>
              <span class="sr-only">Preview mode</span>
            </label>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
